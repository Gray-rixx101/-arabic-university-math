# يولّد مشروع Xcode بالأمر: xcodegen generate
name: Athar
options:
  bundleIdPrefix: com.athar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Athar:
    type: application
    platform: iOS
    sources:
      - path: Athar
      - path: Shared
    info:
      path: Athar/Info.plist
      properties:
        CFBundleDisplayName: أثر
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.athar.habits
            CFBundleURLSchemes: [athar]
    entitlements:
      path: Athar/Athar.entitlements
      properties:
        com.apple.security.application-groups: [group.com.athar.habits]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athar.habits
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AtharWidget

  AtharWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AtharWidget
      - path: Shared
    info:
      path: AtharWidget/Info.plist
      properties:
        CFBundleDisplayName: أثر
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AtharWidget/AtharWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.athar.habits]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athar.habits.widget

schemes:
  Athar:
    build:
      targets:
        Athar: all
        AtharWidget: all
    run:
      config: Debug
    archive:
      config: Release
