name: TestFlight

# يُشغَّل يدويًا من تبويب Actions. يبني التطبيق ويوقّعه تلقائيًا بمفتاح App Store Connect API
# ثم يرفعه إلى TestFlight. يحتاج الأسرار والمتغير المذكورة في ios/TESTFLIGHT.md
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for v in KEY_ID ISSUER_ID TEAM_ID BUNDLE_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see ios/TESTFLIGHT.md)"; missing=1; fi
          done
          if [ -z "$PRIVATE_KEY" ]; then echo "::error::Missing APP_STORE_CONNECT_PRIVATE_KEY"; missing=1; fi
          exit $missing

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Install API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Athar.xcodeproj \
            -scheme Athar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Athar.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            BUNDLE_ID_BASE="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Show archive errors
        if: failure()
        run: grep -E "error:|Provisioning|signing" archive.log | head -80 || true

      - name: Upload to TestFlight
        run: |
          plutil -create xml1 ExportOptions.plist
          plutil -insert method -string app-store-connect ExportOptions.plist
          plutil -insert destination -string upload ExportOptions.plist
          plutil -insert teamID -string "$TEAM_ID" ExportOptions.plist
          plutil -insert signingStyle -string automatic ExportOptions.plist
          plutil -insert uploadSymbols -bool YES ExportOptions.plist
          plutil -insert manageAppVersionAndBuildNumber -bool NO ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Athar.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect > TestFlight after processing (about 10-30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
